version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowai-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-flowai}
      POSTGRES_USER: ${DB_USER:-flowai}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS é obrigatório}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowai} -d ${DB_NAME:-flowai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - flowai

  backend:
    build:
      context: ./backend/flowai-backend
      dockerfile: Dockerfile
    container_name: flowai-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-flowai}
      DB_USER: ${DB_USER:-flowai}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SLACK_DEFAULT_WEBHOOK_URL: ${SLACK_DEFAULT_WEBHOOK_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flowai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: flowai-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - flowai

volumes:
  postgres_data:
    driver: local

networks:
  flowai:
    driver: bridge