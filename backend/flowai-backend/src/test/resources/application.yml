spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-signing-xx
    expiration-ms: 3600000
  groq:
    api-key: test-fake-key
    model: fake
    base-url: http://localhost:9999
  cors:
    allowed-origins: http://localhost

logging:
  level:
    root: WARN
    com.flowai: INFO