spring:
  application:
    name: flowai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowai}
    username: ${DB_USER:flowai}
    password: ${DB_PASS:flowai}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-256bit-key}
    expiration-ms: 31536000000  # 1 ano
  groq:
    api-key: ${GROQ_API_KEY:}
    model: openai/gpt-oss-120b
    base-url: https://api.groq.com/openai/v1

logging:
  level:
    com.flowai: DEBUG